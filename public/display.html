<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
/* Bas-URL: fungerar både på /meny och /meny/admin */
const BASE = location.pathname.replace(/\/(admin|display)\/?$/, '').replace(/\/$/, '');
function baseUrl(sökväg) {
  if (/^https?:\/\//.test(sökväg)) return sökväg;
  return BASE + '/' + String(sökväg).replace(/^\/+/, '');
}
</script>
<meta name="robots" content="noindex" />
<title>Dagens lunch – Matsalen</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100vw;height:100vh;overflow:hidden}
  :root{
    --bg:#0d1b24; --panel:#fff; --ink:#13222e; --muted:#5b6b78;
    --accent:#0f766e; --warn:#b4530f;
  }
  body{background:var(--bg);color:#fff;font-family:system-ui,"Segoe UI",Arial,sans-serif;
       display:flex;flex-direction:column}

  #top{flex:0 0 12vh;display:flex;align-items:center;justify-content:space-between;
       padding:2vmin 3vmin;gap:2vmin}
  #top .datum{font-size:4.6vmin;font-weight:800;letter-spacing:-.02em;text-transform:capitalize}
  #top .titel{font-size:2.2vmin;color:#cfe3e8}
  #top .clock{font-size:3vmin;font-weight:700;font-variant-numeric:tabular-nums;color:#8aa2ad}

  #cards{flex:1 1 auto;display:flex;gap:1.8vmin;padding:1.5vmin 3vmin;
         align-items:stretch;justify-content:center;min-height:0}
  #cards.c3 .card{flex:1 1 0;max-width:31vw}
  #cards.c2 .card{flex:1 1 0;max-width:45vw}
  #cards.c1 .card{flex:1 1 0;max-width:58vw}

  .card{background:var(--panel);color:var(--ink);border-radius:1.6vmin;overflow:hidden;
        display:flex;flex-direction:column;box-shadow:0 1vmin 2.5vmin rgba(0,0,0,.4)}
  .card .photo{height:46%;position:relative;background:#dde3e8;flex:0 0 auto}
  .card .photo img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
  .card .photo .noimg{position:absolute;inset:0;background:linear-gradient(135deg,#0f766e,#155e62)}
  .card .body{padding:1.8vmin 2.2vmin;display:flex;flex-direction:column;gap:1.1vmin;
              flex:1 1 auto;min-height:0;overflow:hidden}
  .card h2{font-size:3.8vmin;line-height:1.08;font-weight:800;letter-spacing:-.02em}
  .card .desc{font-size:2.1vmin;color:#33424e;line-height:1.35}
  .card .ing{font-size:1.8vmin;color:#5b6b78;line-height:1.3}
  .card .badges{display:flex;gap:.8vmin;flex-wrap:wrap}
  .badge{font-size:1.6vmin;font-weight:700;padding:.5vmin 1.1vmin;border-radius:99px;
         background:#eef2f5;color:#33424e}
  .badge.allergen{background:#fde8e8;color:#7f1d1d}
  .badge.tag{background:#e3f2ee;color:#0b5451}
  .card .foot{display:flex;justify-content:space-between;align-items:center;gap:1vmin}
  .card .price{font-size:2.5vmin;font-weight:800;color:var(--accent)}
  .card .origin{font-size:1.7vmin;color:#5b6b78;text-align:right}

  #bottom{flex:0 0 9vh;display:flex;align-items:center;justify-content:space-between;
          padding:1.4vmin 3vmin;gap:2vmin;color:#93a7b3;font-size:1.8vmin}
  #bottom .legend{display:flex;gap:.9vmin;flex-wrap:wrap;align-items:center}
  #bottom .pill{background:#1b2c38;padding:.6vmin 1.2vmin;border-radius:99px;font-size:1.6vmin}

  .closed{background:var(--warn);color:#fff;border-radius:1.6vmin;display:flex;
          align-items:center;justify-content:center;font-size:4vmin;font-weight:800;
          text-align:center;padding:2vmin}

  .offline{position:fixed;top:1vmin;right:1vmin;background:#7f1d1d;color:#fff;
           padding:.8vmin 1.4vmin;border-radius:99px;font-size:1.8vmin;font-weight:700}

  @media (orientation:portrait){
    #cards{flex-direction:column;align-items:center}
    #cards .card{max-width:none;width:100%;flex:1 1 0}
    .card .photo{height:38%}
  }
</style>
</head>
<body>
  <div id="top"></div>
  <div id="cards"></div>
  <div id="bottom"></div>

<script>
  const topEl    = document.getElementById('top');
  const cardsEl  = document.getElementById('cards');
  const bottomEl = document.getElementById('bottom');

  let meny = null;              // senaste giltiga svaret från API:t
  let analyssat = false;        // tappad anslutning?
  let allergenEtiketter = {};

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function hamta() {
    const res = await fetch(baseUrl('api/menu/today'), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }

  function uppdatera() {
    return hamta().then(m => { meny = m; analyssat = false; },
                        () => { analyssat = true; });
  }

  function rendera() {
    const disp = (meny && meny.display) || {};
    const ratter = (meny && meny.dishes) || [];

    /* --- rubik ---- */
    let datumrad = '';
    if (meny) {
      const fin = new Date(meny.date + 'T12:00:00')
        .toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
      datumrad = disp.title
        ? `<div class="titel">${esc(disp.title)}</div><div class="datum">${esc(fin)}</div>`
        : `<div class="datum">${esc(fin)}</div>`;
    }
    const nu = new Date();
    topEl.innerHTML =
      datumrad +
      `<div class="clock">${String(nu.getHours()).padStart(2,'0')}:${String(nu.getMinutes()).padStart(2,'0')}</div>`;

    /* --- kort --- */
    if (!meny) { cardsEl.innerHTML = ''; cardsEl.className = 'c0'; return; }

    if (!ratter.length) {
      cardsEl.className = 'c1';
      cardsEl.innerHTML =
        `<div class="closed" style="flex:1 1 auto">${esc(disp.closedMessage || 'Ingen lunch serveras i dag')}</div>`;
      return;
    }

    cardsEl.className = 'c' + Math.min(ratter.length, 3);
    cardsEl.innerHTML = ratter.map(d => {
      const img = d.image
        ? `<img src="${baseUrl(`images/${encodeURIComponent(d.image)}`)}" alt="${esc(d.name)}" onerror="this.remove()" />`
        : '';
      const badges =
        (d.allergens || []).map(a => `<span class="badge allergen">${esc(allergenEtiketter[a] || a)}</span>`)
          .concat((d.tags || []).map(t => `<span class="badge tag">${esc(t)}</span>`))
          .join('');
      const pris = (d.price === null || d.price === '') ? '' : `<div class="price">${esc(String(d.price))} kr</div>`;
      return `<div class="card">
        <div class="photo">${img}<div class="noimg"></div></div>
        <div class="body">
          <h2>${esc(d.name)}</h2>
          ${d.description ? `<div class="desc">${esc(d.description)}</div>` : ''}
          ${d.ingredients ? `<div class="ing"><strong>Innehåll:</strong> ${esc(d.ingredients)}</div>` : ''}
          <div class="badges">${badges}</div>
          <div class="foot">${pris}${d.origin ? `<div class="origin">${esc(d.origin)}</div>` : ''}</div>
        </div>
      </div>`;
    }).join('');
  }

  function renderaBotten() {
    const disp = (meny && meny.display) || {};
    const ratter = (meny && meny.dishes) || [];
    const taggar = [...new Set(ratter.flatMap(d => d.tags || []))];
    const pills = taggar.map(t => `<span class="pill">${esc(t)}</span>`).join('');
    const uppd = meny ? new Date(meny.updatedAt).toLocaleTimeString('sv-SE',
                        { hour: '2-digit', minute: '2-digit' }) : '--:--';
    bottomEl.innerHTML =
      `<div class="legend">${esc(disp.subtitle || '')}</div>` +
      `<div class="legend">${pills}</div>` +
      `<div class="legend">Uppdaterad ${uppd}${analyssat ? ' · <span class="offline">tappad anslutning</span>' : ''}</div>`;
  }

  /* --- start --- */
  fetch(baseUrl('api/allergen-labels'), { cache: 'no-store' })
    .then(r => r.json())
    .then(labels => { allergenEtiketter = labels || {}; rendera(); renderaBotten(); })
    .catch(() => { allergenEtiketter = {}; rendera(); renderaBotten(); });

  uppdatera();

  /* hämtningsintervallet styrs av display.refreshSeconds (standard 30 s) */
  function schemalagg() {
    const sekunder = Number((meny && meny.display && meny.display.refreshSeconds) || 30);
    setTimeout(() => {
      uppdatera().then(rendera, rendera).then(renderaBotten).finally(schemalagg);
    }, Math.max(5, sekunder) * 1000);
  }
  schemalagg();

  setInterval(() => { rendera(); renderaBotten(); }, 1000);                          // klockan
</script>
</body>
</html>
